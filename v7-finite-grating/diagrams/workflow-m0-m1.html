<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>v7 · M0/M1 workflow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1360px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">V7 · M0/M1 · Workflow</p>
    <h1>Finite-grating reference and benchmark</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img"
           aria-labelledby="workflow-m0-m1-title workflow-m0-m1-desc">
        <title id="workflow-m0-m1-title">v7 M0/M1 workflow: finite-grating reference and RCWA benchmark</title>
        <desc id="workflow-m0-m1-desc">A finite defective grating feeds two solvers, MEEP FDTD and a padded-supercell RCWA; both are de-embedded to the aperture and compared on RMSE and resonance metrics.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- connectors first (z-order) -->
        <path d="M 280,310 H 322 Q 330,310 330,302 V 238 Q 330,230 338,230 H 380"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 280,350 H 322 Q 330,350 330,358 V 422 Q 330,430 338,430 H 380"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 620,230 H 672 Q 680,230 680,238 V 302 Q 680,310 688,310 H 740"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 620,430 H 672 Q 680,430 680,422 V 358 Q 680,350 688,350 H 740"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="940" y1="330" x2="1020" y2="330" stroke="#bf4520"
              stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- N1 finite grating -->
        <g>
          <rect x="80" y="280" width="200" height="100" rx="6" fill="#f5f5f5"/>
          <rect x="80" y="280" width="200" height="100" rx="6" fill="#f5f5f5"
                stroke="rgba(45,49,66,0.28)" stroke-width="1"/>
          <text x="180" y="320" fill="#2d3142" font-size="12" font-weight="600"
                font-family="Geist, system-ui, sans-serif" text-anchor="middle">Finite grating</text>
          <text x="180" y="344" fill="#4f5d75" font-size="9"
                font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">period · amplitude · defects</text>
          <text x="180" y="360" fill="#5a6580" font-size="9"
                font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">GratingSpec</text>
        </g>

        <!-- N2 MEEP (focal) -->
        <g>
          <rect x="380" y="180" width="240" height="100" rx="6" fill="#f5f5f5"/>
          <rect x="380" y="180" width="240" height="100" rx="6" fill="rgba(191,69,32,0.08)"
                stroke="#bf4520" stroke-width="1.2"/>
          <rect x="394" y="192" width="42" height="14" rx="2" fill="transparent"
                stroke="rgba(191,69,32,0.40)" stroke-width="0.8"/>
          <text x="415" y="202" fill="rgba(191,69,32,0.9)" font-size="8"
                font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle"
                letter-spacing="0.08em">TRUTH</text>
          <text x="500" y="230" fill="#2d3142" font-size="12" font-weight="600"
                font-family="Geist, system-ui, sans-serif" text-anchor="middle">MEEP FDTD</text>
          <text x="500" y="252" fill="#4f5d75" font-size="9"
                font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">finite aperture · PML</text>
          <text x="500" y="268" fill="#5a6580" font-size="9"
                font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">→ R(λ), T(λ)</text>
        </g>

        <!-- N3 RCWA supercell -->
        <g>
          <rect x="380" y="380" width="240" height="100" rx="6" fill="#f5f5f5"/>
          <rect x="380" y="380" width="240" height="100" rx="6" fill="#f5f5f5"
                stroke="rgba(45,49,66,0.28)" stroke-width="1"/>
          <rect x="394" y="392" width="36" height="14" rx="2" fill="transparent"
                stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
          <text x="412" y="402" fill="rgba(45,49,66,0.7)" font-size="8"
                font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle"
                letter-spacing="0.08em">FAST</text>
          <text x="500" y="430" fill="#2d3142" font-size="12" font-weight="600"
                font-family="Geist, system-ui, sans-serif" text-anchor="middle">RCWA supercell</text>
          <text x="500" y="452" fill="#4f5d75" font-size="9"
                font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">padded periodization</text>
          <text x="500" y="468" fill="#5a6580" font-size="9"
                font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">→ R(λ), T(λ)</text>
        </g>

        <!-- N4 de-embed -->
        <g>
          <rect x="740" y="280" width="200" height="100" rx="6" fill="#f5f5f5"/>
          <rect x="740" y="280" width="200" height="100" rx="6" fill="#f5f5f5"
                stroke="rgba(45,49,66,0.28)" stroke-width="1"/>
          <text x="840" y="320" fill="#2d3142" font-size="12" font-weight="600"
                font-family="Geist, system-ui, sans-serif" text-anchor="middle">De-embed</text>
          <text x="840" y="344" fill="#4f5d75" font-size="9"
                font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">A = (1−R−T)·Lx/W</text>
          <text x="840" y="360" fill="#5a6580" font-size="9"
                font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">aperture response</text>
        </g>

        <!-- N5 compare -->
        <g>
          <rect x="1020" y="280" width="200" height="100" rx="6" fill="#f5f5f5"/>
          <rect x="1020" y="280" width="200" height="100" rx="6" fill="#f5f5f5"
                stroke="rgba(45,49,66,0.28)" stroke-width="1"/>
          <text x="1120" y="320" fill="#2d3142" font-size="12" font-weight="600"
                font-family="Geist, system-ui, sans-serif" text-anchor="middle">Compare</text>
          <text x="1120" y="344" fill="#4f5d75" font-size="9"
                font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">RMSE · resonances</text>
          <text x="1120" y="360" fill="#5a6580" font-size="9"
                font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">spectral error</text>
        </g>

        <!-- legend -->
        <line x1="40" y1="648" x2="1240" y2="648" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <text x="40" y="672" fill="#4f5d75" font-size="8"
              font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <line x1="120" y1="668" x2="160" y2="668" stroke="#4f5d75" stroke-width="1.2"
              marker-end="url(#arrow)"/>
        <text x="170" y="672" fill="#4f5d75" font-size="9"
              font-family="'Geist Mono', ui-monospace, monospace">data flow</text>
        <line x1="320" y1="668" x2="360" y2="668" stroke="#bf4520" stroke-width="1.4"
              marker-end="url(#arrow-accent)"/>
        <text x="370" y="672" fill="#4f5d75" font-size="9"
              font-family="'Geist Mono', ui-monospace, monospace">ground truth / focal</text>
      </svg>
    </div>
  </div>
</body>
</html>
