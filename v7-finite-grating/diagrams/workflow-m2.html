<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>v7 · M2 workflow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1360px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">V7 · M2 · Workflow</p>
    <h1>Learned spectral correction</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img"
           aria-labelledby="workflow-m2-title workflow-m2-desc">
        <title id="workflow-m2-title">v7 M2 workflow: paired data and learned spectral correction</title>
        <desc id="workflow-m2-desc">MEEP references and fast RCWA spectra form a paired dataset; an encoder plus residual network is trained by geometry to turn the fast RCWA spectrum into a MEEP-matching corrected spectrum.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- connectors first -->
        <path d="M 300,230 H 342 Q 350,230 350,238 V 302 Q 350,310 358,310 H 400"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 300,430 H 342 Q 350,430 350,422 V 358 Q 350,350 358,350 H 400"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="640" y1="330" x2="740" y2="330" stroke="#4f5d75"
              stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="980" y1="330" x2="1060" y2="330" stroke="#bf4520"
              stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- N1 MEEP references -->
        <g>
          <rect x="80" y="180" width="220" height="100" rx="6" fill="#f5f5f5"/>
          <rect x="80" y="180" width="220" height="100" rx="6" fill="#f5f5f5"
                stroke="rgba(45,49,66,0.28)" stroke-width="1"/>
          <text x="190" y="220" fill="#2d3142" font-size="12" font-weight="600"
                font-family="Geist, system-ui, sans-serif" text-anchor="middle">MEEP references</text>
          <text x="190" y="244" fill="#4f5d75" font-size="9"
                font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">24 geometries × 16 λ</text>
          <text x="190" y="260" fill="#5a6580" font-size="9"
                font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">de-embedded R, T, A</text>
        </g>

        <!-- N2 fast RCWA -->
        <g>
          <rect x="80" y="380" width="220" height="100" rx="6" fill="#f5f5f5"/>
          <rect x="80" y="380" width="220" height="100" rx="6" fill="#f5f5f5"
                stroke="rgba(45,49,66,0.28)" stroke-width="1"/>
          <rect x="94" y="392" width="36" height="14" rx="2" fill="transparent"
                stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
          <text x="112" y="402" fill="rgba(45,49,66,0.7)" font-size="8"
                font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle"
                letter-spacing="0.08em">FAST</text>
          <text x="190" y="428" fill="#2d3142" font-size="12" font-weight="600"
                font-family="Geist, system-ui, sans-serif" text-anchor="middle">Fast RCWA</text>
          <text x="190" y="452" fill="#4f5d75" font-size="9"
                font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">one ideal period · nh=8</text>
          <text x="190" y="468" fill="#5a6580" font-size="9"
                font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">de-embedded R, T, A</text>
        </g>

        <!-- N3 paired dataset -->
        <g>
          <rect x="400" y="280" width="240" height="100" rx="6" fill="#ececec"/>
          <rect x="400" y="280" width="240" height="100" rx="6" fill="#ececec"
                stroke="rgba(45,49,66,0.28)" stroke-width="1"/>
          <text x="520" y="320" fill="#2d3142" font-size="12" font-weight="600"
                font-family="Geist, system-ui, sans-serif" text-anchor="middle">Paired dataset</text>
          <text x="520" y="344" fill="#4f5d75" font-size="9"
                font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">geometry · λ · RCWA</text>
          <text x="520" y="360" fill="#5a6580" font-size="9"
                font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">target = MEEP</text>
        </g>

        <!-- N4 encoder + residual -->
        <g>
          <rect x="740" y="280" width="240" height="100" rx="6" fill="#f5f5f5"/>
          <rect x="740" y="280" width="240" height="100" rx="6" fill="#f5f5f5"
                stroke="rgba(45,49,66,0.28)" stroke-width="1"/>
          <text x="860" y="320" fill="#2d3142" font-size="12" font-weight="600"
                font-family="Geist, system-ui, sans-serif" text-anchor="middle">Encoder + residual</text>
          <text x="860" y="344" fill="#4f5d75" font-size="9"
                font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">z_geo · ΔR, ΔT</text>
          <text x="860" y="360" fill="#5a6580" font-size="9"
                font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">split by geometry</text>
        </g>

        <!-- N5 corrected (focal) -->
        <g>
          <rect x="1060" y="280" width="180" height="100" rx="6" fill="#f5f5f5"/>
          <rect x="1060" y="280" width="180" height="100" rx="6" fill="rgba(191,69,32,0.08)"
                stroke="#bf4520" stroke-width="1.2"/>
          <text x="1150" y="320" fill="#2d3142" font-size="12" font-weight="600"
                font-family="Geist, system-ui, sans-serif" text-anchor="middle">Corrected spectrum</text>
          <text x="1150" y="344" fill="#4f5d75" font-size="9"
                font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">matches MEEP</text>
          <text x="1150" y="360" fill="#5a6580" font-size="9"
                font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">RMSE(A) ≈ 0.0018</text>
        </g>

        <!-- legend -->
        <line x1="40" y1="648" x2="1240" y2="648" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <text x="40" y="672" fill="#4f5d75" font-size="8"
              font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <line x1="120" y1="668" x2="160" y2="668" stroke="#4f5d75" stroke-width="1.2"
              marker-end="url(#arrow)"/>
        <text x="170" y="672" fill="#4f5d75" font-size="9"
              font-family="'Geist Mono', ui-monospace, monospace">data</text>
        <line x1="290" y1="668" x2="330" y2="668" stroke="#bf4520" stroke-width="1.4"
              marker-end="url(#arrow-accent)"/>
        <text x="340" y="672" fill="#4f5d75" font-size="9"
              font-family="'Geist Mono', ui-monospace, monospace">result / focal</text>
      </svg>
    </div>
  </div>
</body>
</html>
