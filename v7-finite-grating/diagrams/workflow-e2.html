<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>v7 · Experiment 2 workflow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1360px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">V7 · Experiment 2 · Workflow</p>
    <h1>Differentiable RCWA in the training loop</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img"
           aria-labelledby="workflow-e2-title workflow-e2-desc">
        <title id="workflow-e2-title">v7 Experiment 2 workflow: encoder, differentiable RCWA and residual</title>
        <desc id="workflow-e2-desc">A geometry encoder predicts an effective amplitude and latent, a differentiable unit-cell RCWA computes the spectrum, a residual network corrects it, and the loss backpropagates through RCWA to update the encoder.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- connectors first (z-order) -->
        <line x1="340" y1="250" x2="420" y2="250" stroke="#4f5d75"
              stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="660" y1="250" x2="740" y2="250" stroke="#4f5d75"
              stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="960" y1="250" x2="1040" y2="250" stroke="#4f5d75"
              stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="1140" y1="300" x2="1140" y2="420" stroke="#4f5d75"
              stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 1040,470 H 88 Q 80,470 80,462 V 258 Q 80,250 88,250 H 120"
              fill="none" stroke="#bf4520" stroke-width="1.4" stroke-dasharray="5,4"
              marker-end="url(#arrow-accent)"/>

        <!-- gradient label on the return path -->
        <rect x="536" y="450" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="560" y="460" fill="#bf4520" font-size="8"
              font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle"
              letter-spacing="0.06em">UPDATE</text>

        <!-- N1 encoder -->
        <g>
          <rect x="120" y="200" width="220" height="100" rx="6" fill="#f5f5f5"/>
          <rect x="120" y="200" width="220" height="100" rx="6" fill="#f5f5f5"
                stroke="rgba(45,49,66,0.28)" stroke-width="1"/>
          <text x="230" y="240" fill="#2d3142" font-size="12" font-weight="600"
                font-family="Geist, system-ui, sans-serif" text-anchor="middle">Geometry encoder</text>
          <text x="230" y="264" fill="#4f5d75" font-size="9"
                font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">GratingSpec → z_geo</text>
          <text x="230" y="280" fill="#5a6580" font-size="9"
                font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">+ effective cfg</text>
        </g>

        <!-- N2 differentiable RCWA (focal) -->
        <g>
          <rect x="420" y="200" width="240" height="100" rx="6" fill="#f5f5f5"/>
          <rect x="420" y="200" width="240" height="100" rx="6" fill="rgba(191,69,32,0.08)"
                stroke="#bf4520" stroke-width="1.2"/>
          <rect x="434" y="212" width="52" height="14" rx="2" fill="transparent"
                stroke="rgba(191,69,32,0.40)" stroke-width="0.8"/>
          <text x="460" y="222" fill="rgba(191,69,32,0.9)" font-size="8"
                font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle"
                letter-spacing="0.08em">PHYSICS</text>
          <text x="540" y="240" fill="#2d3142" font-size="12" font-weight="600"
                font-family="Geist, system-ui, sans-serif" text-anchor="middle">Differentiable RCWA</text>
          <text x="540" y="264" fill="#4f5d75" font-size="9"
                font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">one ideal period · nh=8</text>
          <text x="540" y="280" fill="#5a6580" font-size="9"
                font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">∂R/∂amp through TORCWA</text>
        </g>

        <!-- N3 residual -->
        <g>
          <rect x="740" y="200" width="220" height="100" rx="6" fill="#f5f5f5"/>
          <rect x="740" y="200" width="220" height="100" rx="6" fill="#f5f5f5"
                stroke="rgba(45,49,66,0.28)" stroke-width="1"/>
          <text x="850" y="240" fill="#2d3142" font-size="12" font-weight="600"
                font-family="Geist, system-ui, sans-serif" text-anchor="middle">Residual NN</text>
          <text x="850" y="264" fill="#4f5d75" font-size="9"
                font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">[z_geo, R, T, A, λ]</text>
          <text x="850" y="280" fill="#5a6580" font-size="9"
                font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">→ ΔR, ΔT</text>
        </g>

        <!-- N4 loss -->
        <g>
          <rect x="1040" y="200" width="200" height="100" rx="6" fill="#f5f5f5"/>
          <rect x="1040" y="200" width="200" height="100" rx="6" fill="#f5f5f5"
                stroke="rgba(45,49,66,0.28)" stroke-width="1"/>
          <text x="1140" y="240" fill="#2d3142" font-size="12" font-weight="600"
                font-family="Geist, system-ui, sans-serif" text-anchor="middle">Loss</text>
          <text x="1140" y="264" fill="#4f5d75" font-size="9"
                font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">corrected vs MEEP</text>
          <text x="1140" y="280" fill="#5a6580" font-size="9"
                font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">MSE(R, T, A)</text>
        </g>

        <!-- N5 backprop -->
        <g>
          <rect x="1040" y="420" width="200" height="100" rx="6" fill="#f5f5f5"/>
          <rect x="1040" y="420" width="200" height="100" rx="6" fill="#f5f5f5"
                stroke="rgba(45,49,66,0.28)" stroke-width="1"/>
          <rect x="1054" y="432" width="36" height="14" rx="2" fill="transparent"
                stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
          <text x="1072" y="442" fill="rgba(45,49,66,0.7)" font-size="8"
                font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle"
                letter-spacing="0.08em">GRAD</text>
          <text x="1140" y="460" fill="#2d3142" font-size="12" font-weight="600"
                font-family="Geist, system-ui, sans-serif" text-anchor="middle">Backprop</text>
          <text x="1140" y="484" fill="#4f5d75" font-size="9"
                font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">clip · AdamW</text>
          <text x="1140" y="500" fill="#5a6580" font-size="9"
                font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">update encoder</text>
        </g>

        <!-- legend -->
        <line x1="40" y1="648" x2="1240" y2="648" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <text x="40" y="672" fill="#4f5d75" font-size="8"
              font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <line x1="120" y1="668" x2="160" y2="668" stroke="#4f5d75" stroke-width="1.2"
              marker-end="url(#arrow)"/>
        <text x="170" y="672" fill="#4f5d75" font-size="9"
              font-family="'Geist Mono', ui-monospace, monospace">forward pass</text>
        <line x1="330" y1="668" x2="370" y2="668" stroke="#bf4520" stroke-width="1.4"
              stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
        <text x="380" y="672" fill="#4f5d75" font-size="9"
              font-family="'Geist Mono', ui-monospace, monospace">gradient update</text>
      </svg>
    </div>
  </div>
</body>
</html>
